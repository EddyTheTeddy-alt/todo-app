<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Task</title>
    <link rel="stylesheet" href="{% static 'style.css' %}?v=4">
</head>
<body>
    <div class="container">
        <h1>Update Task</h1>
        <p class="dashboard-text">EDIT TASK</p>
        <h2>Update details</h2>
        <p class="sub-text">Change the task, due date, description, or status.</p>
        {% if error %}
        <p class="form-error">{{ error }}</p>
        {% endif %}

        <form method="post" class="task-form update-form">
            {% csrf_token %}

            <div class="field-block full">
                <label for="task">Task</label>
                <input type="text" id="task" name="task" value="{{ task.task }}" required>
            </div>

            <div class="field-block">
                <label for="due_date">Due Date</label>
                <input type="date" id="due_date" name="due_date" value="{{ task.due_date|date:'Y-m-d' }}" required>
            </div>

            <div class="field-block">
                <label for="description">Description</label>
                <input type="text" id="description" name="description" value="{{ task.description }}">
            </div>

            <label class="check-row">
                <input type="checkbox" id="status" name="status" {% if task.status %}checked{% endif %}>
                <span>Mark as completed</span>
            </label>

            <button type="submit" class="add-btn">Save Changes</button>
        </form>

        <a href="{% url 'dashboard' %}" class="logout-btn">Back to Dashboard</a>
    </div>
</body>
</html>
