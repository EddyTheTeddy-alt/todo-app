<!DOCTYPE html> 
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link rel="stylesheet" href="{% static 'style.css' %}?v=4">
</head>
<body>
    <div class="page-shell">
        <div class="form-card">
            <div class="hero-copy">
                <p class="eyebrow">Create Account</p>
                <h1>Register</h1>
                <p class="subtitle">Create your account to start managing your tasks.</p>
            </div>
            {% if error %}
            <p class="form-error">{{ error }}</p>
            {% endif %}

            <form action="" method="post" class="form-grid">
                {% csrf_token %}
                <div class="field">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Username" value="{{ entered_username|default:'' }}" required>
                </div>

                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Email" value="{{ entered_email|default:'' }}">
                </div>

                <div class="field">
                    <label for="phone">Phone</label>
                    <input type="text" id="phone" name="phone" placeholder="Phone" value="{{ entered_phone|default:'' }}">
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Password" required>
                </div>

                <div class="field">
                    <label for="confirm_password">Confirm Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm Password" required>
                </div>

                <div class="actions">
                    <button type="submit" class="btn">Register</button>
                </div>
            </form>

            <p class="form-link">Already have an account? <a href="{% url 'login' %}">Login</a></p>
        </div>
    </div>
</body>
</html>
